name: TartanHQ
description: >-
  Tartan (TartanHQ) is an India-based enterprise automation and verification-infrastructure
  company that unifies fragmented business systems (HRIS, ERP, CRM, government/regulatory
  sources) behind a single set of APIs and AI agents. Its core products are HyperSync
  (real-time income, identity, and employment data across 80+ systems), HyperVerify
  (a unified suite for identity, employment, and business verification), and HyperApps
  (AI agents that run onboarding, underwriting, and verification workflows end to end).
  Tartan ships a broad verification catalog — Aadhaar, PAN, UPI, GST, ITR, bank-account,
  DigiLocker, employment/EPFO, address, and document-OCR checks — serving banking,
  lending, insurance, HR-tech, and travel customers to speed KYC/KYB, reduce fraud, and
  keep records continuously current. Backed by 500 Global.
